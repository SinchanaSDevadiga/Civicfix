<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CivicFix - Admin Dashboard</title>

    <!-- IMPORTANT: Admin dashboard uses admin.css -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>🏙️ CivicFix</h1>

        <p>Admin Dashboard</p>

        <div class="admin-buttons">

            <button
                class="home-button"
                onclick="window.location.href='index.html'">
                🏠 Back to CivicFix
            </button>

            <button
                class="logout-button"
                onclick="adminLogout()">
                🚪 Logout
            </button>

        </div>

    </header>


    <!-- ADMIN TITLE -->
    <section class="admin-header">

        <h2>📊 Civic Issue Management</h2>

        <p>
            Monitor and manage reported civic issues.
        </p>

    </section>


    <!-- DASHBOARD CARDS -->
    <section class="admin-dashboard">

        <div class="admin-card">

            <h3>📋 Total Reports</h3>

            <p id="adminReported">0</p>

        </div>


        <div class="admin-card">

            <h3>⏳ Pending</h3>

            <p id="adminPending">0</p>

        </div>


        <div class="admin-card">

            <h3>🔄 In Progress</h3>

            <p id="adminProgress">0</p>

        </div>


        <div class="admin-card">

            <h3>✅ Resolved</h3>

            <p id="adminResolved">0</p>

        </div>

    </section>


    <!-- CATEGORY SECTION -->
    <section class="category-section">

        <h2>🏷️ Reports by Category</h2>

        <div id="categoryStats"></div>

    </section>


    <!-- CHART -->
    <section class="chart-section">

        <h2>📊 Issue Distribution</h2>

        <div id="issueChart"></div>

    </section>


    <!-- ALL ISSUES -->
    <section class="admin-issues">

        <h2>📋 All Reported Issues</h2>

        <div id="adminIssueList"></div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 CivicFix | Smart Civic Issue Reporting System
        </p>

    </footer>


    <!-- ADMIN JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>

</html>
